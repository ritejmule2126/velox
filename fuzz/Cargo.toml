[package]
name = "velox-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
http = "1"
velox-core = { path = "../crates/velox-core" }

[workspace]

[[bin]]
name = "request_head"
path = "fuzz_targets/request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guard_stream"
path = "fuzz_targets/guard_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked"
path = "fuzz_targets/chunked.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_headers"
path = "fuzz_targets/typed_headers.rs"
test = false
doc = false
bench = false
