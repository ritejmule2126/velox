# Container defaults. Mount your own file over /etc/velox/velox.toml:
#   docker run -v $PWD/velox.toml:/etc/velox/velox.toml:ro -p 8080:8080 -p 8443:8443 -p 8443:8443/udp ghcr.io/ritejmule2126/velox
# Ports above 1024 because the image runs as an unprivileged user.
[server]
http_addr  = "0.0.0.0:8080"
https_addr = "0.0.0.0:8443"
h3         = true

[tls]
self_signed_fallback = true   # replace with [[tls.certs]] or [tls.acme] in production

[admin]
addr = "127.0.0.1:9901"       # loopback-only: use `docker exec` + `velox reload`

[[upstream]]
name     = "app"
backends = [{ addr = "host.docker.internal:3000" }]

[[route]]
upstream = "app"
