# =============================================================================
# Velox sample configuration
#
#   velox validate -c velox.toml     check it (reports *every* problem at once)
#   velox start    -c velox.toml     run it
#   velox reload                     re-read this file in a running instance
#                                    (also: `kill -HUP <pid>` or the admin API)
#
# Everything below except the listener addresses is hot-reloadable: Velox
# builds a new immutable snapshot, validates it, and swaps it in atomically.
# In-flight requests finish on the snapshot they started with, keep-alive
# connections stay open, and an invalid file is rejected without side effects.
# Durations accept "250ms", "5s", "10m", "1h".
# =============================================================================

# -----------------------------------------------------------------------------
# Listeners  (changing these needs a restart)
# -----------------------------------------------------------------------------
[server]
# Cleartext HTTP/1.1. Use 0.0.0.0:80 in production (needs CAP_NET_BIND_SERVICE).
http_addr  = "0.0.0.0:8080"
# TLS listener: HTTP/2 + HTTP/1.1 (ALPN). Use 0.0.0.0:443 in production.
https_addr = "0.0.0.0:8443"
# HTTP/3 (QUIC over UDP) on the same port as https_addr unless h3_addr is set.
# TCP responses advertise it:  Alt-Svc: h3=":8443"; ma=86400
h3              = true
# h3_addr       = "0.0.0.0:8443"
alt_svc_max_age = 86400

accept_workers = 1          # parallel accept loops per TCP listener; keep <= CPU cores. Raise it
                            # (with reuse_port) only if one accept loop saturates a core.
reuse_port     = true       # SO_REUSEPORT when accept_workers > 1: one socket per worker, the kernel
                            # spreads connections. Run `velox doctor` to check OS limits first.
tcp_nodelay    = true
backlog        = 1024
drain_timeout  = "30s"      # SIGTERM/SIGINT: wait this long for in-flight requests

# Behind an L4 load balancer (AWS NLB, HAProxy `send-proxy-v2`, ...): read the
# PROXY protocol v1/v2 header it prepends to every connection, so logs, rate
# limits, connection limits and X-Forwarded-* see the real client instead of the
# load balancer. Applies to http_addr, https_addr and [[tcp_proxy]] with
# `proxy_protocol = true`; HTTP/3 (UDP) cannot carry it. Needs a restart.
#
# Only `proxy_protocol_trusted` peers may send a header: anyone else is refused
# before a byte is read, so a client can never forge its own address. The header
# is mandatory on such a listener - plain HTTP/TLS without it is dropped.
# proxy_protocol         = true
# proxy_protocol_trusted = ["10.0.0.0/8"]     # your load balancer's addresses (required)

# -----------------------------------------------------------------------------
# DoS hardening: hard bounds on every dimension of a request
# -----------------------------------------------------------------------------
[limits]
max_header_bytes           = 16384     # request line + all headers (HTTP/1)
max_headers                = 100       # (max 128)
max_uri_bytes              = 8192
max_request_body_bytes     = 10485760  # 10 MiB; 0 = unlimited
max_connections            = 10000     # 0 = unlimited
max_connections_per_ip     = 256       # IPv6 sources are grouped per /64
max_streams_per_connection = 100       # HTTP/2 and HTTP/3
retry_body_buffer_bytes    = 65536     # bodies up to this size can be retried on another backend

# -----------------------------------------------------------------------------
# Timeouts: nothing in Velox waits forever
# -----------------------------------------------------------------------------
[timeouts]
tls_handshake      = "10s"   # TLS and QUIC handshakes
header_read        = "10s"   # full request head must arrive in this time (Slowloris)
idle_keepalive     = "60s"   # between requests on a connection
request_body_idle  = "30s"   # max gap between client body frames (slow POST)
upstream_connect   = "3s"
upstream_response  = "30s"   # until upstream response *headers*
upstream_body_idle = "60s"   # max gap between upstream body frames
write_stall        = "30s"   # a client that never drains our response is cut off

# -----------------------------------------------------------------------------
# TLS (rustls). Pick one or more certificate sources.
# -----------------------------------------------------------------------------
[tls]
# Development only: generate an in-memory self-signed certificate when no
# configured certificate matches. Remove in production.
self_signed_fallback = true

# Certificates are chosen by SNI. Wildcards ("*.example.com") are supported; an
# entry with no server_names is the default. Reloaded on `velox reload`.
# [[tls.certs]]
# server_names = ["example.com", "www.example.com"]
# cert_file    = "/etc/velox/certs/example.com.crt"
# key_file     = "/etc/velox/certs/example.com.key"

# Mutual TLS: require (or, with client_auth_required = false, accept) client
# certificates on the HTTPS and HTTP/3 listeners. The verified identity reaches
# the backend as X-Client-Cert-Subject / X-Client-Cert-Serial; the same headers
# from clients are always stripped first. The bundle hot-reloads (SIGHUP).
# client_ca_file       = "/etc/velox/client-ca.pem"
# client_auth_required = true

[tls.hsts]                    # sent on TLS responses only
enabled            = true
max_age            = 31536000
include_subdomains = false
preload            = false

# Automatic certificates via ACME HTTP-01 (Let's Encrypt). Needs a binary built
# with `--features acme`, port 80 reachable from the internet, and `http_addr`
# listening on it. Issued certificates are installed without a restart and
# renewed ~30 days before expiry.
# [tls.acme]
# domains       = ["example.com", "www.example.com"]
# contact_email = "ops@example.com"
# directory_url = "https://acme-v02.api.letsencrypt.org/directory"   # use the staging URL while testing
# cache_dir     = "/var/lib/velox/acme"

# -----------------------------------------------------------------------------
# Header hygiene
# -----------------------------------------------------------------------------
[security]
# Peers whose X-Forwarded-* / Forwarded headers are believed (e.g. your cloud
# load balancer). From anyone else those headers are discarded and rebuilt, so
# clients cannot spoof their address.
trusted_proxies    = []        # e.g. ["10.0.0.0/8", "fd00::/8"]
# Client address ACLs, judged on the *resolved* client (after PROXY protocol and
# trusted_proxies) before anything else. Deny beats allow; IPv4-mapped IPv6 is
# matched as IPv4. Routes can add their own lists (they can only narrow access).
# ip_allow = ["10.0.0.0/8"]     # if set, only these may connect
# ip_deny  = ["10.6.6.0/24"]
nosniff            = true      # add X-Content-Type-Options: nosniff if the upstream did not
hide_server_header = false
allow_underscores_in_host = false   # '_' is not an RFC 1123 hostname character; enable for container service names
[security.response_headers]    # added only when the upstream did not set them
# "referrer-policy" = "no-referrer"

# -----------------------------------------------------------------------------
# Rate limiting: token bucket, lock-free, per client IP (or per header value)
# -----------------------------------------------------------------------------
# Default policy for every route; a route can override it or opt out with
# `rate_limit = { enabled = false }`.
[rate_limit]
requests_per_second = 200.0
burst               = 400
key                 = "ip"                 # or "header:x-api-key" (falls back to the IP if absent)

# -----------------------------------------------------------------------------
# Admin API + metrics (localhost only)
# -----------------------------------------------------------------------------
[admin]
addr = "127.0.0.1:9901"     # must be a loopback address
# token_env = "VELOX_ADMIN_TOKEN"   # require `Authorization: Bearer $VELOX_ADMIN_TOKEN`

[telemetry]
log_level   = "info"        # or e.g. "info,velox_proxy=debug"; RUST_LOG overrides
log_format  = "json"        # "json" (one object per line) or "pretty"
access_log  = true          # one line per request with request_id, status, latency…
# W3C Trace Context: continue a valid inbound `traceparent` (new span id for this
# hop), mint one otherwise, forward `tracestate` only alongside a valid parent,
# and add `trace_id` to the access log.
traceparent = false
# Prometheus text endpoint also served at http://127.0.0.1:9901/metrics.
# Expose it to a scraper on its own port (serves ONLY /metrics and /healthz):
# metrics_addr = "0.0.0.0:9100"

# -----------------------------------------------------------------------------
# Response compression (opt-in)
# -----------------------------------------------------------------------------
# Streams zstd / brotli / gzip according to Accept-Encoding (q-values honoured,
# `algorithms` order breaks ties). Adds `Vary: Accept-Encoding`, drops
# Content-Length, weakens strong ETags. Never touches: responses that are
# already encoded, bodies under `min_size`, types not in `content_types`,
# text/event-stream, gRPC, `Cache-Control: no-transform`, 206/204/304, HEAD.
# Output is flushed whenever the upstream pauses, so streamed responses are not
# held back. Per-route override: `compress = true|false`.
[compression]
enabled      = false
# algorithms = ["zstd", "br", "gzip"]
# min_size   = 1024                  # bytes; only when Content-Length is known
# level      = "default"             # "fast" | "default" | "best"
# content_types = ["text/*", "application/json", "application/*+json", "application/javascript",
#                  "application/xml", "application/*+xml", "application/wasm", "application/x-ndjson",
#                  "image/svg+xml"]
# Compression is CPU work, so it is kept off the async event loop and bounded:
# max_concurrent_encoders = 256      # more simultaneous compressed responses go out uncompressed
# offload_threshold       = 32768    # slices this big run on dedicated worker threads
# worker_threads          = 0        # 0 = one per CPU (2..=16)

# -----------------------------------------------------------------------------
# In-memory response cache (opt-in per route with `cache = {}`)
# -----------------------------------------------------------------------------
# Caches GET (and answers HEAD from it) per RFC 9111's shared-cache rules:
# only responses that state their freshness (s-maxage / max-age / Expires, or the
# route's default_ttl); never no-store / private / no-cache / Set-Cookie /
# `Vary: *`; honours Vary, If-None-Match and If-Modified-Since (304 from memory);
# requests with Authorization, Range or - by default - a Cookie bypass it.
# A successful POST/PUT/PATCH/DELETE drops the URL; purge on demand with
#   POST /admin/v1/cache/purge  {"all": true} | {"route": "...", "path_prefix": "/static/"}
[cache]
# max_bytes       = 67108864         # total memory (bodies + headers + keys)
# max_entry_bytes = 1048576          # bigger bodies stream through uncached
# shards          = 16               # independent LRUs (lock granularity)

# -----------------------------------------------------------------------------
# Upstreams
# -----------------------------------------------------------------------------
[[upstream]]
name      = "app"
# round_robin | least_conn | p2c (power of two choices) | consistent_hash
algorithm = "p2c"
# protocol: "http1" (default); "h2c" (HTTP/2 prior knowledge, cleartext);
#           "h2" (HTTP/2 everywhere: prior knowledge on http://, ALPN on https://)
protocol  = "http1"
retries   = 1               # extra attempts on *another* backend (connect failures; idempotent requests on timeouts)
# Circuit breaker: at most this many in-flight requests per backend. A full
# backend is skipped by the balancer; if every backend is full the client gets
# an immediate 503 + Retry-After (no queueing, no cascading overload).
# A backend can override it: { addr = "...", max_inflight = 50 }
# max_inflight = 200

# Track a hostname backend's addresses (Kubernetes headless service, multi-A
# record): each address becomes its own pool member, re-resolved on an interval.
# Unchanged answers cost nothing; changes add/retire members without disturbing
# survivors or in-flight requests; a failed lookup keeps the last good answer.
# https:// members are verified against the host name, not the address.
# dns = { refresh_interval = "30s", timeout = "5s", max_addrs = 32, ipv6 = true }
# hash_on = "ip"            # for consistent_hash: "ip", "path" or "header:x-user-id"
backends = [
  { addr = "127.0.0.1:3000", weight = 1 },
  { addr = "127.0.0.1:3001", weight = 1 },
  # { addr = "unix:/run/app/web.sock" },   # Unix domain sockets work too
  # { addr = "https://app.internal:8443" },  # TLS to the backend (default port 443)
]

# TLS to `https://` backends (zero-trust / multi-cloud / Kubernetes). Optional:
# the defaults verify against the bundled Mozilla roots and send SNI = backend host.
# [upstream.tls]
# server_name = "app.internal"             # SNI + certificate name (default: the backend's host)
# ca_file     = "/etc/velox/backend-ca.pem" # trust ONLY this CA bundle (private PKI)
# client_cert_file = "/etc/velox/client.crt"  # mTLS: identity presented to the backend
# client_key_file  = "/etc/velox/client.key"
# reload_interval  = "5s"                  # files are re-checked; rotation needs no reload
# insecure_skip_verify = false             # DANGEROUS: accept any certificate

# Active health checks: probes with jitter and hysteresis.
[upstream.health]
kind                = "http"       # or "tcp"
path                = "/healthz"
interval            = "5s"
timeout             = "2s"
jitter              = 0.2          # ±20% so probes don't synchronise
healthy_threshold   = 2            # consecutive successes to come back
unhealthy_threshold = 3            # consecutive failures to go down
status_min          = 200
status_max          = 399

# Passive outlier detection (circuit breaking) driven by real traffic.
[upstream.outlier]
enabled              = true
consecutive_failures = 5           # connect errors, timeouts, 502/503/504
base_ejection_time   = "30s"       # doubles on each repeat, up to max_ejection_time
max_ejection_time    = "5m"
max_ejection_percent = 50          # never eject more than this share of the pool

[upstream.pool]
idle_timeout         = "60s"
max_idle_per_backend = 64

# -----------------------------------------------------------------------------
# Routes: exact host > wildcard host > any host; longest path prefix wins
# -----------------------------------------------------------------------------
[[route]]
name          = "site"
hosts         = []                  # [] = any host; e.g. ["example.com", "*.example.com"]
path_prefix   = "/"
upstream      = "app"
# strip_prefix   = false            # remove path_prefix before forwarding
# redirect_https = false            # answer plain-HTTP requests with a 308 to https
#                                   # (needs `hosts`, or `canonical_host`, so arbitrary Host headers are never reflected)
# canonical_host = "example.com"    # fixed redirect target host
#                                   # (a request a *trusted proxy* already received over https - X-Forwarded-Proto
#                                   #  or Forwarded: proto=https - is never redirected, so TLS-terminating load
#                                   #  balancers cannot cause a redirect loop)
# compress       = true             # override [compression].enabled for this route
# cache = { default_ttl = "30s", max_ttl = "1h" }   # enable the response cache (see [cache])
#                                   # stampede protection and stale serving (RFC 5861):
#                                   #   coalesce = true, coalesce_timeout = "10s"   (one backend fetch per object)
#                                   #   stale_while_revalidate = "30s"  (serve instantly, refresh in the background)
#                                   #   stale_if_error = "5m"           (serve the old copy while the backend fails)
# ip_allow = ["10.1.0.0/16"]        # per-route ACL (in addition to [security] ip_allow / ip_deny)
# ip_deny  = []
#                                   # also: ignore_query = true, allow_cookies = true (read the README first)
# timeout        = "10s"            # override timeouts.upstream_response
# request_headers = { "x-env" = "prod" }
# rate_limit = { requests_per_second = 20.0, burst = 40, key = "header:x-api-key" }
#
# Verify a JWT at the edge: invalid tokens get 401 and never reach the backend.
# HS256 / RS256 / ES256 only (allow-listed; `none` is never accepted), keys from
# a PEM, a JWKS file or an HS256 secret (file or env var), hot-rotated.
# [route.jwt]
# algorithms     = ["RS256", "ES256"]
# jwks_file      = "/etc/velox/jwks.json"      # or public_key_file = "...", secret_file / secret_env (HS256)
# issuer         = "https://login.example.com"
# audience       = ["api"]
# leeway         = "30s"
# forward_claims = ["sub", "roles"]            # -> X-Jwt-sub, X-Jwt-roles (client X-Jwt-* is always stripped)
# required       = true                        # false: anonymous allowed, a presented token must still be valid
#
# CORS, enforced at the edge: preflights are answered by Velox (204/403) and never
# reach the backend; the backend's own Access-Control-* headers are replaced by
# this policy on every response, including Velox's own 429/502.
# [route.cors]
# allow_origins     = ["https://app.example.com", "https://*.example.com"]   # or ["*"]
# allow_methods     = ["GET", "POST"]            # default GET, HEAD, POST ("*" = any)
# allow_headers     = ["content-type", "authorization"]   # "*" = reflect the preflight
# expose_headers    = ["x-request-id"]
# allow_credentials = false                      # never with allow_origins = ["*"]
# max_age           = "10m"

# -----------------------------------------------------------------------------
# Optional: raw TCP (L4) load balancing, e.g. a database or MQTT broker.
# Reuses an [[upstream]] (health checks, outlier detection, balancing).
# -----------------------------------------------------------------------------
# [[tcp_proxy]]
# listen       = "0.0.0.0:5433"
# upstream     = "postgres"
# idle_timeout = "10m"
# proxy_protocol = true            # expect a PROXY header (see [server].proxy_protocol_trusted)
