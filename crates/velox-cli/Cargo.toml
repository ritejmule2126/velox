[package]
name = "velox-cli"
description = "The `velox` binary: start, validate, reload, doctor, version"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "velox"
path = "src/main.rs"

[lib]
name = "velox_cli"
path = "src/lib.rs"

[features]
default = ["mimalloc"]
# Automatic certificates via ACME HTTP-01.
acme = ["velox-security/acme"]
# Use mimalloc as the global allocator of the `velox` binary (library crates are
# unaffected and stay `#![forbid(unsafe_code)]`). Build with `--no-default-features`
# for the system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
velox-core.workspace = true
velox-telemetry.workspace = true
velox-security.workspace = true
velox-health.workspace = true
velox-proxy.workspace = true
velox-admin.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
mimalloc = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
time.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
zstd.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }
